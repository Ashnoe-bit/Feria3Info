<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Analizador de Emociones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .video-container {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 15px;
        }
        
        #videoStream {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .results {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .result-item {
            margin-bottom: 15px;
            padding: 15px;
            background: #f7fafc;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .result-label {
            font-size: 0.9rem;
            color: #718096;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        
        .result-value {
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            color: #2d3748;
            font-weight: bold;
        }
        
        .recommendations {
            background: #c6f6d5;
            border-left-color: #48bb78;
        }
        
        .recommendations .result-label {
            color: #22543d;
        }
        
        .rec-list {
            list-style: none;
            margin-top: 10px;
        }
        
        .rec-list li {
            padding: 8px 0;
            color: #2f855a;
            font-size: clamp(0.9rem, 3vw, 1rem);
            padding-left: 20px;
            position: relative;
        }
        
        .rec-list li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #48bb78;
            font-weight: bold;
        }
        
        .status {
            text-align: center;
            padding: 10px;
            background: #fed7d7;
            color: #c53030;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
        
        .status.active {
            display: block;
        }
        
        .info {
            text-align: center;
            color: white;
            font-size: 0.9rem;
            margin-top: 15px;
            opacity: 0.9;
        }
        
        @media (max-width: 600px) {
            body {
                padding: 5px;
            }
            
            .results {
                padding: 15px;
            }
            
            .result-item {
                padding: 12px;
            }
        }
        
        @media (orientation: landscape) and (max-height: 500px) {
            .container {
                display: flex;
                flex-direction: row;
                gap: 10px;
            }
            
            .video-container, .results {
                flex: 1;
                margin-bottom: 0;
            }
            
            h1 {
                font-size: 1.2rem;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 Analizador de Emociones</h1>
        
        <div id="status" class="status">
            ⚠️ No se detectó cámara. Conecta una cámara para continuar.
        </div>
        
        <div class="video-container">
            <img id="videoStream" src="/video" alt="Video stream">
        </div>
        
        <div class="results">
            <div class="result-item">
                <div class="result-label">Género</div>
                <div class="result-value" id="genero">Cargando...</div>
            </div>
            
            <div class="result-item">
                <div class="result-label">Edad Aproximada</div>
                <div class="result-value" id="edad">Cargando...</div>
            </div>
            
            <div class="result-item">
                <div class="result-label">Emoción</div>
                <div class="result-value" id="emocion">Cargando...</div>
            </div>
            
            <div class="result-item recommendations">
                <div class="result-label">💡 Recomendaciones</div>
                <ul class="rec-list" id="recomendaciones">
                    <li>Cargando...</li>
                </ul>
            </div>
        </div>
        
        <div class="info">
            <p>Actualizando en tiempo real • Funciona en cualquier dispositivo</p>
        </div>
    </div>
    
    <script>
        // Actualizar resultados cada 2 segundos
        function actualizarResultados() {
            fetch('/resultado')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('genero').textContent = data.genero || 'N/A';
                    document.getElementById('edad').textContent = data.edad || 'N/A';
                    document.getElementById('emocion').textContent = data.emocion || 'N/A';
                    
                    const recList = document.getElementById('recomendaciones');
                    if (data.recomendaciones && data.recomendaciones.length > 0) {
                        recList.innerHTML = data.recomendaciones
                            .map(rec => `<li>${rec}</li>`)
                            .join('');
                    } else {
                        recList.innerHTML = '<li>Sin recomendaciones</li>';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('status').classList.add('active');
                });
        }
        
        // Actualizar cada 2 segundos
        actualizarResultados();
        setInterval(actualizarResultados, 2000);
        
        // Verificar si la imagen carga
        document.getElementById('videoStream').onerror = function() {
            document.getElementById('status').classList.add('active');
        };
        
        // Service Worker para funcionar offline (PWA básico)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:text/javascript,' + encodeURIComponent(`
                self.addEventListener('fetch', function(event) {
                    event.respondWith(fetch(event.request).catch(function() {
                        return new Response('Offline');
                    }));
                });
            `)).catch(() => {
                console.log('Service Worker no registrado (opcional)');
            });
        }
    </script>
</body>
</html>
